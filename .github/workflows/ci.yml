name: CI

on:
  push:
    branches: [main, demo/pitch-integration]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reject conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json'; then
            echo "Unresolved merge conflict markers found"
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('backend/.oxlintrc.json','utf8'))"

      - run: npm ci

      - run: npm run build

      - run: npm run lint --workspace backend

      - run: npm test

      - name: Start demo dependencies
        run: docker compose -p signal-demo-ci up -d --wait

      - name: Prepare demo environment
        run: cp backend/.env.example backend/.env

      - run: npm run demo:seed
        env:
          DEMO_MODE: "true"

      - run: npm run test:e2e
        env:
          DEMO_MODE: "true"

      - name: Stop demo dependencies
        if: always()
        run: docker compose -p signal-demo-ci down -v
